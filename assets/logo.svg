<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 62" role="img" aria-label="SecretChapters — mahmuda.fun">
  <defs>
    <!-- Warm rose-gold gradient for the lips mark — glossy, layered, no
         raster image, matching the site's existing gold/dark palette
         rather than a jarring pure red. -->
    <linearGradient id="lipsGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f2b3c2"/>
      <stop offset="45%" stop-color="#d9718f"/>
      <stop offset="100%" stop-color="#8f2f4a"/>
    </linearGradient>
    <linearGradient id="lipsHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9d4c9"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Mark: a simplified, stylized kiss/lips glyph — a tasteful, common
       romance-imprint motif (like a lipstick kiss print), not a
       photographic or explicit image. -->
  <g transform="translate(3,17)" filter="url(#softShadow)">
    <path d="M2 8
             C2 3, 8 1, 13 4
             C15.2 5.3, 16.8 5.3, 19 4
             C20.6 3, 22.4 3, 24 4
             C26.2 5.3, 27.8 5.3, 30 4
             C35 1, 41 3, 41 8
             C35 5.3, 28.5 6.3, 24.8 8
             C22.4 6.6, 20.6 6.6, 19 8
             C16.5 6.3, 9 5.3, 2 8 Z"
          fill="url(#lipsGrad)" stroke="#5c1c30" stroke-width="0.5"/>
    <path d="M2 8 C 8 20, 35 20, 41 8 C 34 15, 9 15, 2 8 Z"
          fill="url(#lipsGrad)" stroke="#5c1c30" stroke-width="0.5"/>
    <path d="M6 7 C10 3, 15 3, 18 5.5 C13 4.5, 9 5 6 7 Z" fill="url(#lipsHighlight)"/>
  </g>

  <!-- Wordmark: SecretChapters as one word, "Secret" lighter weight, per
       the site owner's own convention on the home page. -->
  <g font-family="Georgia, 'Playfair Display', serif" font-weight="700" filter="url(#softShadow)">
    <text x="58" y="38" font-size="21" letter-spacing="0.2" fill="url(#textGrad3d)">
      <tspan font-weight="400" font-style="italic">Secret</tspan><tspan font-weight="700">Chapters</tspan>
    </text>
  </g>
</svg>
