<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" role="img" aria-label="mahmuda.fun logo">
  <!-- Playful crescent moon -->
  <g transform="translate(0,2)">
    <path d="M24 8 A16 16 0 1 0 30 40 A12.5 12.5 0 1 1 24 8 Z"
          fill="url(#moonGrad)" stroke="#d4af37" stroke-width="0.8"/>
    <!-- Two playful stars -->
    <path d="M42 12 l1.6 4.2 4.4 0.4 -3.4 2.8 1 4.3 -3.6 -2.3 -3.6 2.3 1-4.3 -3.4-2.8 4.4-0.4 Z" fill="#d4af37"/>
    <path d="M10 30 l1.1 2.9 3.1 0.3 -2.4 1.9 0.7 3 -2.4-1.6 -2.4 1.6 0.7-3 -2.4-1.9 3.1-0.3 Z" fill="#d4af37" opacity="0.85"/>
    <!-- Wink dot -->
    <circle cx="20" cy="32" r="2.2" fill="#0a0a0c"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Georgia, 'Playfair Display', serif" font-weight="700">
    <text x="54" y="36" font-size="34" fill="url(#textGrad)" letter-spacing="0.5">mahmuda</text>
    <text x="178" y="36" font-size="20" fill="#d4af37">.fun</text>
  </g>
  <defs>
    <linearGradient id="moonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d77a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#e7e2d8"/>
    </linearGradient>
  </defs>
</svg>
