<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 62" role="img" aria-label="Hushed Chapters — mahmuda.fun">
  <defs>
    <!-- Glossy, layered gradients simulate a dimensional/3D mark using pure
         SVG (no raster figure) — a bright top highlight fading into a deep
         base gives the crescent + book-spine mark real depth/sheen. -->
    <linearGradient id="moon3d" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fbe7a8"/>
      <stop offset="35%" stop-color="#eec367"/>
      <stop offset="70%" stop-color="#c99a2e"/>
      <stop offset="100%" stop-color="#93701c"/>
    </linearGradient>
    <linearGradient id="moonHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe0"/>
      <stop offset="100%" stop-color="#d8cba3"/>
    </linearGradient>
    <linearGradient id="textGrad3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9d4c9"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Mark: crescent moon wrapped around a slim open-book spine ("chapters") -->
  <g transform="translate(3,5)" filter="url(#softShadow)">
    <path d="M25 4 A21 21 0 1 0 32 44 A16.5 16.5 0 1 1 25 4 Z" fill="url(#moon3d)" stroke="#7c5e17" stroke-width="0.6"/>
    <path d="M25 4 A21 21 0 0 0 12 9 A16.5 16.5 0 0 1 25 4 Z" fill="url(#moonHighlight)"/>
    <!-- book-spine chevrons peeking from the moon's hollow, echoing "chapters" -->
    <path d="M19 17 l5.8 6 -5.8 6" fill="none" stroke="url(#pageGrad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 17 l5.8 6 -5.8 6" fill="none" stroke="url(#pageGrad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Georgia, 'Playfair Display', serif" font-weight="700" filter="url(#softShadow)">
    <text x="58" y="27" font-size="19" letter-spacing="0.3" fill="url(#textGrad3d)">Hushed</text>
    <text x="58" y="48" font-size="19" letter-spacing="0.3" fill="url(#textGrad3d)">Chapters</text>
  </g>
</svg>
