  <script>
    (function () {
      var t = document.getElementById('themeToggle');
      if (t) t.addEventListener('click', function () {
        var html = document.documentElement;
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('nights-theme', next); } catch (e) {}
      });
      try {
        var saved = localStorage.getItem('nights-theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
      var m = document.getElementById('menuToggle');
      var links = document.getElementById('navLinks');
      if (m && links) m.addEventListener('click', function () { links.classList.toggle('open'); });
    })();
