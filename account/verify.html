<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm your account | mahmuda.fun</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="rating" content="adult" />
  <link rel="canonical" href="https://mahmuda.fun/account/verify.html" />
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/navigation.css" />
  <link rel="stylesheet" href="../assets/css/blog.css" />
  <link rel="stylesheet" href="../assets/css/ads.css" />
  <style>
    .account-wrap { max-width: 420px; margin: 0 auto; padding: 100px 16px 60px; }
    .account-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; text-align: center; }
    .account-card h1 { font-family: var(--font-display); font-size: 1.4rem; margin: 0 0 10px; color: var(--text-primary); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo" aria-label="mahmuda.fun home">
        <img class="logo-svg" src="../assets/logo.svg" alt="mahmuda.fun logo" width="160" height="42" decoding="async" />
      </a>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="../index.html" class="nav-item">Home</a>
        <a href="../account/" class="nav-item active" id="navAccountLink"><span id="navAccountLabel">Account</span></a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><span class="icon-moon">☾</span><span class="icon-sun">☀</span></button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main class="account-wrap">
    <div class="account-card" id="verifyCard"><p>Confirming your account…</p></div>
  </main>

  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/navigation.js" defer></script>
  <script src="../assets/js/site-components.js" defer></script>
  <script>
  (function () {
    'use strict';
    function init() {
      var card = document.getElementById('verifyCard');
      var m = (window.location.search || '').match(/[?&]token=([^&]+)/);
      var token = m ? decodeURIComponent(m[1]) : null;
      if (!token || !window.NightsAuth) {
        card.innerHTML = '<h1>Invalid link</h1><p class="rr-hint">This confirmation link is missing its token. Copy the full link from your email.</p>';
        return;
      }
      window.NightsAuth.verifyEmail(token).then(function () {
        card.innerHTML = '<h1>You’re all set</h1><p class="rr-hint rr-success">Your account is confirmed and you’re logged in.</p><a class="rr-submit" style="display:inline-block;text-decoration:none;margin-top:10px;" href="../index.html">Back to stories</a>';
      }).catch(function (err) {
        card.innerHTML = '<h1>Link expired</h1><p class="rr-hint rr-error">' + String(err.message || 'This link is invalid or has expired.').replace(/</g, '&lt;') + '</p><a href="../account/" style="color:var(--accent)">Request a new one</a>';
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>
</body>
</html>
