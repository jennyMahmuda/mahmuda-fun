<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | mahmuda.fun</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://mahmuda.fun/admin/" />
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/navigation.css" />
  <link rel="stylesheet" href="../assets/css/blog.css" />
    <link rel="stylesheet" href="../assets/css/ads.css" />
    <link rel="stylesheet" href="../assets/css/admin-redesign.css" />
  <style>
    .admin-wrap { max-width: 900px; margin: 0 auto; padding: 100px 16px 60px; }
    .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .admin-head h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
    .admin-list { display: flex; flex-direction: column; gap: 10px; }
    .admin-search {
      display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: .9rem;
      padding: 10px 14px; margin: 16px 0 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary);
    }
    .admin-search:focus { outline: none; border-color: var(--accent); }
    .admin-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; align-items: center; gap: 14px; justify-content: space-between; }
    .admin-row-title { font-weight: 600; color: var(--text-primary); }
    .admin-row-meta { font-size: .8rem; color: var(--text-muted); margin-top: 3px; }
    .admin-badge { font-size: .72rem; padding: 3px 9px; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .admin-badge.draft { background: var(--bg-elevated); color: var(--text-secondary); }
    .admin-badge.published { background: var(--accent-soft); color: var(--accent); }
    .admin-badge.live { background: rgba(120, 200, 130, .16); color: #78c882; }
    .admin-row-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .admin-row-actions a, .admin-row-actions button { font-size: .82rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); background: none; cursor: pointer; }
    .admin-row-actions a:hover, .admin-row-actions button:hover { color: var(--accent); border-color: var(--accent); }
    .admin-empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
    .admin-gate { max-width: 420px; margin: 0 auto; padding: 100px 16px 60px; text-align: center; }
    .admin-guide { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; }
    .admin-guide summary { cursor: pointer; padding: 16px 18px; font-weight: 600; color: var(--text-primary); list-style: none; display: flex; align-items: center; justify-content: space-between; }
    .admin-guide summary::-webkit-details-marker { display: none; }
    .admin-guide summary::after { content: '+'; color: var(--accent); font-size: 1.2rem; }
    .admin-guide[open] summary::after { content: '−'; }
    .admin-guide-body { padding: 0 18px 18px; color: var(--text-secondary); font-size: .92rem; line-height: 1.75; }
    .admin-guide-body h3 { color: var(--text-primary); font-family: var(--font-display); font-size: 1.05rem; margin: 20px 0 8px; }
    .admin-guide-body h3:first-child { margin-top: 0; }
    .admin-guide-body ol, .admin-guide-body ul { margin: 0 0 10px 20px; }
    .admin-guide-body li { margin-bottom: 6px; }
    .admin-guide-body code { background: var(--bg-elevated); padding: 1px 6px; border-radius: 4px; font-size: .85em; }
    .admin-guide-body .admin-guide-note { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; font-size: .88rem; }
    .admin-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 34px 0 14px; }
    .admin-section-head h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; }
    .admin-review-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
    .admin-review-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .admin-review-name { font-weight: 600; color: var(--text-primary); }
    .admin-review-meta { font-size: .78rem; color: var(--text-muted); }
    .admin-review-text { margin: 8px 0 10px; color: var(--text-secondary); font-size: .92rem; line-height: 1.6; }
    .admin-review-actions { display: flex; gap: 8px; }
    .admin-review-actions button { font-size: .82rem; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--text-secondary); }
    .admin-review-actions button.approve:hover { color: #78c882; border-color: #78c882; }
    .admin-review-actions button.reject:hover { color: #e0687a; border-color: #e0687a; }
    .admin-review-actions button:disabled { opacity: .5; cursor: default; }
    .admin-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
    .admin-tabs a { font-size: .82rem; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); text-decoration: none; }
    .admin-tabs a:hover { color: var(--accent); border-color: var(--accent); }
    .admin-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .admin-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    .admin-table th, .admin-table td { padding: 10px 14px; text-align: left; white-space: nowrap; }
    .admin-table thead th { background: var(--bg-elevated); color: var(--text-muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .admin-table tbody tr { border-top: 1px solid var(--border); }
    .admin-table tbody tr:hover { background: var(--bg-elevated); }
    .admin-table td.admin-cell-title { white-space: normal; max-width: 320px; color: var(--text-primary); font-weight: 600; }
    .admin-table td.admin-cell-muted { color: var(--text-muted); }
    .admin-section-actions { display: flex; gap: 8px; align-items: center; }
    .admin-section-actions button { font-size: .8rem; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--text-secondary); cursor: pointer; }
    .admin-section-actions button:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo" aria-label="mahmuda.fun home">
        <img class="logo-svg" src="../assets/logo.svg" alt="mahmuda.fun logo" width="160" height="42" decoding="async" />
      </a>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="../index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
        <a href="../account/" class="nav-item" id="navAccountLink"><span class="nav-icon">👤</span><span id="navAccountLabel">Account</span></a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><span class="icon-moon">☾</span><span class="icon-sun">☀</span></button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main id="adminMain">
    <div class="admin-gate"><p>Loading…</p></div>
  </main>

  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/navigation.js" defer></script>
  <script src="../assets/js/site-components.js" defer></script>
  <script src="../assets/js/story-promo.js" defer></script>
  <script src="../assets/js/newsletter-footer.js" defer></script>
  <script src="../assets/js/rating-review.js" defer></script>
  <script>
  (function () {
    'use strict';

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderGate(message, showLoginLink) {
      var main = document.getElementById('adminMain');
      main.innerHTML =
        '<div class="admin-gate">' +
          '<div class="mrf-admin-brand" style="border:0;justify-content:center;"><img src="../assets/logo.svg" alt="" width="30" height="30"><span><strong>MAHMUDA.FUN</strong><span>STUDIO</span></span></div>' +
          '<h1>Admin workspace</h1>' +
          '<p class="rr-hint">' + escapeHtml(message) + '</p>' +
          (showLoginLink ? '<form id="adminLoginForm" class="admin-login-form"><label class="rr-field"><span>Admin username</span><input name="username" autocomplete="username" required></label><label class="rr-field"><span>Admin password</span><input name="password" type="password" autocomplete="current-password" required></label><button class="rr-submit" type="submit">Sign in securely</button><p id="adminLoginStatus" class="rr-hint"></p></form><p class="rr-hint">Credentials are checked server-side through Worker secrets.</p>' : '') +
        '</div>';
      var form = document.getElementById('adminLoginForm');
      if (form) form.addEventListener('submit', function (event) {
        event.preventDefault();
        var fd = new FormData(form), status = document.getElementById('adminLoginStatus');
        status.textContent = 'Signing in…';
        window.NightsAuth.adminLogin(String(fd.get('username') || ''), String(fd.get('password') || '')).then(function () { window.location.reload(); }).catch(function (err) { status.textContent = err.message || 'Sign in failed'; });
      });
    }

    // Full A-to-Z walkthrough, right here on the page instead of only in
    // a repo doc — closed by default so it doesn't crowd the story list,
    // but always one click away.
    function adminGuideHtml() {
      return '<details class="admin-guide">' +
        '<summary>📖 কিভাবে নতুন Story লিখবেন / Image, Video যোগ করবেন — সম্পূর্ণ গাইড (A to Z)</summary>' +
        '<div class="admin-guide-body">' +

          '<h3>১. নতুন Story শুরু করা</h3>' +
          '<ol>' +
            '<li>উপরে <strong>"+ New story"</strong>-এ ক্লিক করুন।</li>' +
            '<li><strong>Story ID</strong> — এটাই গল্পের ঠিকানার (URL) অংশ হবে, তাই শুধু ইংরেজি ছোট হাতের অক্ষর, সংখ্যা, আর <code>-</code>/<code>_</code> ব্যবহার করুন (যেমন: <code>rainy-night-part1</code>)। একবার Save করার পর এটা আর বদলানো যাবে না, তাই ভেবেচিন্তে দিন।</li>' +
            '<li><strong>Title</strong> — গল্পের আসল শিরোনাম, যা reader-রা দেখবে (যেমন: <code>বৃষ্টির রাতে – পর্ব ১</code>)।</li>' +
            '<li><strong>Excerpt</strong> — ২-৩ লাইনের ছোট preview, যেটা card/feed-এ দেখা যায়। পুরো গল্প বলে দেবেন না, curiosity রাখুন।</li>' +
            '<li><strong>Category</strong> — একটা শব্দ/phrase (যেমন: <code>Forbidden</code>)। <strong>Tags</strong> — কমা (,) দিয়ে আলাদা করে একাধিক ট্যাগ দিন (যেমন: <code>Romance, Bhabi, Neighbor</code>)।</li>' +
            '<li><strong>Series</strong> ও <strong>Episode</strong> — এটা যদি কোনো সিরিজের একটা পর্ব হয়, তাহলে সিরিজের নাম আর পর্ব নাম্বার দিন (না হলে খালি রাখুন)।</li>' +
          '</ol>' +

          '<h3>২. গল্পের লেখা (Story text)</h3>' +
          '<p>নিচের বড় বক্সে সরাসরি বাংলা/ইংরেজিতে গল্প লিখুন। কিছু সাধারণ নিয়ম:</p>' +
          '<ul>' +
            '<li>দুইটা প্যারাগ্রাফের মাঝে একটা <strong>ফাঁকা লাইন (blank line)</strong> রাখুন — এটাই নতুন প্যারাগ্রাফ বোঝায়।</li>' +
            '<li>heading/উপশিরোনাম দিতে চাইলে লাইনের শুরুতে <code># </code> বা <code>## </code> লিখুন।</li>' +
            '<li>গল্পের মাঝে অতিরিক্ত ছবি বসাতে চাইলে (cover ছাড়াও) লিখুন: <code>![বিবরণ](ছবির-লিংক)</code></li>' +
          '</ul>' +

          '<h3>৩. Image (ছবি) কিভাবে যোগ করবেন</h3>' +
          '<p>এখন সরাসরি এই পেজ থেকে ছবি আপলোড করার সুবিধা নেই — ছবি আগে GitHub repository-তে রাখতে হবে, তারপর সেই ছবির path/link এখানে <strong>Cover image URL</strong> field-এ বসাতে হবে:</p>' +
          '<ol>' +
            '<li>GitHub-এ repository খুলুন → <code>assets/images/</code> folder-এ যান (অথবা সেখানে নতুন কোনো folder বানান, যেমন <code>assets/images/story-covers/</code>)।</li>' +
            '<li><strong>Add file → Upload files</strong> ক্লিক করে আপনার ছবি upload করুন এবং commit করুন।</li>' +
            '<li>Upload হয়ে যাওয়ার পর ছবির উপর ক্লিক করে ঠিকানা (path) দেখুন — যেমন <code>assets/images/story-covers/my-photo.jpg</code>।</li>' +
            '<li>ঠিক এই path-টা কপি করে এই ফর্মের <strong>Cover image URL</strong> field-এ বসান।</li>' +
          '</ol>' +
          '<div class="admin-guide-note">আপনি আগেও ঠিক এইভাবেই কিছু ছবি (hero, category background) সরাসরি GitHub-এ upload করেছেন — একই পদ্ধতি, শুধু path-টা এখন এই form-এ বসাতে হবে।</div>' +

          '<h3>৪. Video / Audio কিভাবে যোগ করবেন</h3>' +
          '<p>একইভাবে — video/audio file আগে GitHub-এ (অথবা যেকোনো hosting-এ, যেমন YouTube/Cloudflare Stream) upload করে তার সরাসরি link নিয়ে <strong>Video URL</strong> বা <strong>Audio URL</strong> field-এ বসান। <code>.mp4</code>/<code>.webm</code> (video) এবং <code>.mp3</code>/<code>.m4a</code> (audio) ফাইল সরাসরি কাজ করবে — YouTube/Facebook-এর মতো embed/page link কাজ করবে না, ফাইলের সরাসরি link লাগবে।</p>' +
          '<div class="admin-guide-note">এটা এই Video URL/Cover image URL-এর চেয়েও জরুরি: গল্পের ওপরে <strong>Content type</strong> dropdown-টাও ঠিকমতো বসান (Video / Image gallery)। <code>/video/</code> আর <code>/gellery/</code> page দুটো ঠিক এই field অনুযায়ী গল্প দেখায় — শুধু Video URL/Cover URL বসিয়ে Content type "Story (text)"-ই রেখে দিলে গল্পটা ঐ page-এ দেখা যাবে না।</div>' +

          '<h3>৫. Save এবং Publish</h3>' +
          '<ul>' +
            '<li><strong>Save draft</strong> — শুধু draft হিসেবে জমা থাকবে, live হবে না। পরে এসে edit করা যাবে।</li>' +
            '<li><strong>Save &amp; publish</strong> — draft save হওয়ার সাথে সাথে publish-ও হয়ে যাবে। এরপর প্রায় ২০ মিনিটের মধ্যে (অথবা GitHub Actions থেকে "Sync admin-submitted stories" workflow manually চালালে সাথে সাথেই) গল্পটা আসল website-এ live হয়ে যাবে।</li>' +
            '<li>একবার live হয়ে যাওয়ার পর এই panel থেকে edit করলে শুধু draft record বদলাবে, আসল live page বদলাতে <code>story-post/&lt;id&gt;.md</code> ফাইল সরাসরি GitHub-এ edit করতে হবে — ইচ্ছাকৃতভাবে এমন রাখা হয়েছে, যাতে হাতে ঠিক করা কোনো লেখা ভুলবশত মুছে না যায়।</li>' +
          '</ul>' +

        '</div>' +
      '</details>';
    }

    function statusBadge(story) {
      if (story.status === 'removed') return '<span class="admin-badge draft">Removed from live</span>';
      if (story.status === 'deleted') return '<span class="admin-badge draft">Queued for removal</span>';
      if (story.status === 'hidden') return '<span class="admin-badge draft">Hidden</span>';
      if (story.status === 'draft') return '<span class="admin-badge draft">Draft</span>';
      if (story.syncedAt) return '<span class="admin-badge live">Live</span>';
      return '<span class="admin-badge published">Publishing…</span>';
    }

    function storyRowHtml(s) {
      return '<div class="admin-row">' +
        '<div>' +
          '<div class="admin-row-title">' + escapeHtml(s.title) + ' ' + statusBadge(s) + '</div>' +
          '<div class="admin-row-meta">' + escapeHtml(s.id) + ' · ' + escapeHtml(s.category) +
            (s.updatedAt ? ' · updated ' + escapeHtml(s.updatedAt) : '') +
            (s.status === 'published' && !s.syncedAt ? ' · syncs to the live site automatically within ~20 min' : '') +
          '</div>' +
        '</div>' +
        '<div class="admin-row-actions">' +
          (s.syncedAt ? '<button type="button" data-story-preview="' + escapeHtml(s.id) + '">Live preview</button>' : '') +
          '<a href="story.html?id=' + encodeURIComponent(s.id) + '">Edit</a>' +
          (s.status !== 'deleted' && s.status !== 'removed' ? '<button type="button" class="admin-danger" data-story-delete="' + escapeHtml(s.id) + '">Delete</button>' : '') +
        '</div>' +
      '</div>';
    }

    function filterStories(stories, query) {
      var q = query.trim().toLowerCase();
      if (!q) return stories;
      return stories.filter(function (s) {
        return (s.title || '').toLowerCase().indexOf(q) !== -1 ||
          (s.id || '').toLowerCase().indexOf(q) !== -1 ||
          (s.category || '').toLowerCase().indexOf(q) !== -1;
      });
    }

    function renderStoryRows(stories, query) {
      var list = document.getElementById('adminStoriesSection');
      if (!list) return;
      var filtered = filterStories(stories, query || '');
      if (!stories.length) {
        list.innerHTML = '<p class="admin-empty">No stories yet. Create your first one.</p>';
      } else if (!filtered.length) {
        list.innerHTML = '<p class="admin-empty">No stories match "' + escapeHtml(query) + '".</p>';
      } else {
        list.innerHTML = filtered.map(storyRowHtml).join('');
        bindStoryActions(list, stories);
      }
    }

    function livePreviewHtml(story) {
      var paragraphs = String(story.content || '').split(/\\n\\s*\\n/).map(function (p) { return '<p>' + escapeHtml(p).replace(/\\n/g, '<br>') + '</p>'; }).join('');
      var cats = (story.categories || [story.category || '']).map(function (c) { return '<span class="preview-route-chip">' + escapeHtml(c) + '</span>'; }).join('');
      return '<div class="live-preview-backdrop" data-preview-close><article class="live-preview-modal"><button type="button" class="live-preview-close" data-preview-close aria-label="Close">×</button><div class="admin-pipeline-kicker">Live Preview Mode</div><div class="live-preview-type">' + escapeHtml(story.contentType || 'text').toUpperCase() + '</div><h2>' + escapeHtml(story.title) + '</h2><p class="live-preview-excerpt">' + escapeHtml(story.excerpt || '') + '</p><div class="live-preview-routes">' + cats + '</div><div class="live-preview-body">' + paragraphs + '</div><div class="live-preview-seo"><strong>SEO title:</strong> ' + escapeHtml(story.seoTitle || story.title) + '<br><strong>Meta:</strong> ' + escapeHtml(story.metaDescription || story.excerpt || '') + '</div><div class="admin-row-actions"><a href="story.html?id=' + encodeURIComponent(story.id) + '">Edit this post</a><button type="button" class="admin-danger" data-preview-delete="' + escapeHtml(story.id) + '">Delete post</button></div></article></div>';
    }

    function renderAnalytics(rows, ga4Available) {
      var section = document.getElementById('adminAnalyticsSection');
      if (!section) return;
      var rowsHtml = rows.map(function (r) {

        '<p class="rr-hint" id="ga4StatusMsg" style="margin-bottom:10px;"></p>' +
        (rows.length
          ? '<div class="admin-table-wrap"><table class="admin-table">' +

              '<tbody>' + rowsHtml + '</tbody>' +
            '</table></div>'
          : '<p class="admin-empty">No published stories yet.</p>');

      var checkBtn = document.getElementById('checkGa4Btn');
      var statusMsg = document.getElementById('ga4StatusMsg');
      if (checkBtn) {
        checkBtn.addEventListener('click', function () {
          checkBtn.disabled = true;

    function loadAnalytics() {
      var section = document.getElementById('adminAnalyticsSection');
      if (!section) return;
      section.innerHTML = '<div class="admin-section-head"><h2>Story performance</h2></div><p class="admin-empty">Loading…</p>';

      Promise.all([
        fetch('../stories/index.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return []; }),
        window.NightsRatingReview ? window.NightsRatingReview.getSummaryMap() : Promise.resolve({}),
        window.NightsRatingReview ? window.NightsRatingReview.getReactionSummaryMap() : Promise.resolve({}),
        fetch(ANALYTICS_API_BASE + '/api/analytics/top-content').then(function (r) { return r.json(); }).catch(function () { return null; }),
      ]).then(function (results) {
        var stories = Array.isArray(results[0]) ? results[0] : (results[0].stories || []);
        var ratingMap = results[1] || {};
        var reactionMap = results[2] || {};
        var topContent = results[3] && Array.isArray(results[3].topContent) ? results[3].topContent : null;
        var viewsMap = {};
        if (topContent) topContent.forEach(function (row) { viewsMap[row.storyId] = row.views; });

        var rows = stories.map(function (s) {
          var rating = ratingMap[s.id] || { count: 0, average: 0 };
          var reaction = reactionMap[s.id] || { count: 0 };
          return {
            id: s.id,
            title: s.title,
            category: s.category,
            ratingAvg: rating.average,
            ratingCount: rating.count,
            recommends: reaction.count,
            // GA4's top-content list only ever holds ~10 rows, so a story
            // missing from it means "not in the top 10", not "confirmed
            // zero views" — null (→ "—") is the honest value there, not 0.
            views: topContent && Object.prototype.hasOwnProperty.call(viewsMap, s.id) ? viewsMap[s.id] : null,
          };
        }).sort(function (a, b) {
          if (b.ratingAvg !== a.ratingAvg) return b.ratingAvg - a.ratingAvg;
          return b.ratingCount - a.ratingCount;
        });

        renderAnalytics(rows, !!topContent);
      }).catch(function () {
        section.innerHTML = '<div class="admin-section-head"><h2>Story performance</h2></div><p class="rr-hint">Could not load analytics right now.</p>';
      });
    }

    function init() {
      if (!window.NightsAuth) { renderGate('Something didn\'t load — try refreshing.', false); return; }
      window.NightsAuth.me().then(function (data) {
        if (!data.authenticated) { renderGate('Log in with an admin account to manage stories.', true); return; }
        if (!data.isAdmin) { renderGate('This account does not have content-manager access.', false); return; }
        window.NightsAuth.adminListStories().then(function (data) {
          renderList(data.stories || []);
        }).catch(function (err) {
          renderGate('Could not load stories: ' + err.message, false);
        });
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>
</body>
</html>
