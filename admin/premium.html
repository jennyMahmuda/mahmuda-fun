<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Studio | Content Manager | mahmuda.fun</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://mahmuda.fun/admin/premium.html" />
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/navigation.css" />
  <link rel="stylesheet" href="../assets/css/blog.css" />
    <link rel="stylesheet" href="../assets/css/ads.css" />
    <link rel="stylesheet" href="../assets/css/admin-redesign.css" />
  <style>
    .admin-wrap { max-width: 760px; margin: 0 auto; padding: 100px 16px 60px; }
    .admin-wrap h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 0 0 4px; }
    .admin-form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-top: 18px; }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .admin-grid .rr-field.full { grid-column: 1 / -1; }
    .rr-field textarea { min-height: 90px; resize: vertical; }
    .rr-field textarea#storyContent { min-height: 320px; font-family: var(--font-body); }
    .admin-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .admin-actions button { min-width: 140px; }
    .admin-btn-secondary { background: var(--bg-elevated) !important; color: var(--text-primary) !important; }
    .admin-gate { max-width: 420px; margin: 0 auto; padding: 100px 16px 60px; text-align: center; }
    .rr-checkbox { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--text-secondary); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo" aria-label="mahmuda.fun home">
        <img class="logo-svg" src="../assets/logo.svg" alt="mahmuda.fun logo" width="160" height="42" decoding="async" />
      </a>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="index.html" class="nav-item"><span class="nav-icon">📚</span>Content Manager</a><a href="premium.html" class="nav-item"><span class="nav-icon">★</span>Premium Studio</a>
        <a href="../account/" class="nav-item" id="navAccountLink"><span class="nav-icon">👤</span><span id="navAccountLabel">Account</span></a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><span class="icon-moon">☾</span><span class="icon-sun">☀</span></button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main id="adminMain">
    <div class="admin-gate"><p>Loading…</p></div>
  </main>

  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/navigation.js" defer></script>
  <script src="../assets/js/site-components.js" defer></script>
  <script src="../assets/js/story-promo.js" defer></script>
  <script src="../assets/js/newsletter-footer.js" defer></script>
  <script src="../assets/js/admin-pipeline.js" defer></script>
  <script>
  (function () {
    'use strict';

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function qs(name) {
      var m = (window.location.search || '').match(new RegExp('[?&]' + name + '=([^&]+)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    function renderGate(message, showLoginLink) {
      var main = document.getElementById('adminMain');
      main.innerHTML =
        '<div class="admin-gate">' +
          '<h1>Content Manager</h1>' +
          '<p class="rr-hint">' + escapeHtml(message) + '</p>' +
          (showLoginLink ? '<p><a class="rr-submit" style="display:inline-block;text-decoration:none;margin-top:10px;" href="../account/">Log in</a></p>' : '') +
        '</div>';
    }

    function renderForm(existing) {
      var isNew = !existing;
      var editorMode = 'premium';
      var modeLabel = 'Premium content';
      var main = document.getElementById('adminMain');
      main.innerHTML =
        '<div class="admin-wrap">' +
          '<div class="admin-pipeline-kicker">Premium Studio</div>' +
          '<h1>' + (isNew ? 'New premium content' : 'Edit premium content') + '</h1>' +
          '<p class="rr-hint rr-success">This separate workflow always publishes to verified members only. Story, video and image formats remain available, with the same SEO readiness checks.</p>' +
          (!isNew && existing.syncedAt ? '<p class="rr-hint rr-success">This story is live. Changes saved here will requeue it for live regeneration after the next sync/deployment.</p>' : '') +
          '<form class="admin-form-card" id="storyForm">' +
            '<div class="admin-grid">' +
              '<label class="rr-field full"><span>Story ID (used in the URL, letters/numbers/-/_ only — can\'t change after creating)</span>' +
                '<input type="text" name="id" id="storyId" pattern="[a-zA-Z0-9_-]{1,160}" required ' + (isNew ? '' : 'readonly') + ' value="' + escapeHtml(existing ? existing.id : '') + '"></label>' +
              '<label class="rr-field full"><span>Title</span><input type="text" name="title" required maxlength="300" value="' + escapeHtml(existing ? existing.title : '') + '"></label>' +
              '<label class="rr-field full"><span>Excerpt / Summary (short teaser shown on cards)</span><textarea name="excerpt" required maxlength="600">' + escapeHtml(existing ? existing.excerpt : '') + '</textarea></label>' +
              '<label class="rr-field"><span>Category</span><input type="text" name="category" required maxlength="60" value="' + escapeHtml(existing && existing.categories ? existing.categories.join(',') : (existing ? existing.category : '')) + '"></label>' +
              '<label class="rr-field"><span>Tags (comma separated)</span><input type="text" name="tags" value="' + escapeHtml(existing && existing.tags ? existing.tags.join(', ') : '') + '"></label>' +
              '<label class="rr-field"><span>Series (optional)</span><input type="text" name="series" maxlength="120" value="' + escapeHtml(existing && existing.series ? existing.series : '') + '"></label>' +
              '<label class="rr-field"><span>Episode number (optional)</span><input type="number" name="episode" min="1" value="' + (existing && existing.episode ? existing.episode : '') + '"></label>' +
              '<label class="rr-field"><span>Content type</span><select name="contentType">' +
                '<option value="text"' + (!existing || existing.contentType === 'text' ? ' selected' : '') + '>Story (text)</option>' +
                '<option value="video"' + (existing && existing.contentType === 'video' ? ' selected' : '') + '>Video</option>' +
                '<option value="image"' + (existing && existing.contentType === 'image' ? ' selected' : '') + '>Image gallery</option>' +
              '</select>' +
              '<span class="rr-hint" id="contentTypeHelp" style="margin-top:4px;">Choose a type to show only the fields used by that live destination.</span>' +
              '</label>' +
              '<label class="rr-field"><span>Cover image URL (optional)</span><input type="text" name="coverUrl" value="' + escapeHtml(existing && existing.coverUrl ? existing.coverUrl : '') + '"><input type="file" name="coverFile" accept="image/jpeg,image/png,image/webp,image/avif" data-upload-field="coverUrl" style="margin-top:8px"></label>' +
              '<label class="rr-field"><span>Cover image Alt text <small>(describe the image for accessibility and SEO)</small></span><input type="text" name="coverAlt" maxlength="180" value="' + escapeHtml(existing && existing.coverAlt ? existing.coverAlt : '') + '" placeholder="Example: Main poster for the new episode"></label>' +
              '<label class="rr-field full"><span>SEO title <small>(30–65 characters)</small></span><input type="text" name="seoTitle" maxlength="65" value="' + escapeHtml(existing && existing.seoTitle ? existing.seoTitle : '') + '" placeholder="Search title"></label>' +
              '<label class="rr-field full"><span>Meta description <small>(70–158 characters)</small></span><textarea name="metaDescription" maxlength="158" placeholder="Search description">' + escapeHtml(existing && existing.metaDescription ? existing.metaDescription : '') + '</textarea></label>' +
              '<label class="rr-field full"><span>SEO keywords <small>(comma separated)</small></span><input type="text" name="seoKeywords" value="' + escapeHtml(existing && existing.seoKeywords ? existing.seoKeywords.join(', ') : '') + '" placeholder="primary keyword, related keyword"></label>' +
              '<label class="rr-field" data-editor-type="video"><span>Video URL (required for Video posts; direct .mp4/.webm link)</span><input type="text" name="videoUrl" value="' + escapeHtml(existing && existing.videoUrl ? existing.videoUrl : '') + '"><input type="file" name="videoFile" accept="video/mp4,video/webm,video/quicktime" data-upload-field="videoUrl" style="margin-top:8px"></label>' +
              '<label class="rr-field" data-editor-type="video"><span>Video thumbnail URL (recommended for Video posts)</span><input type="text" name="thumbnailUrl" value="' + escapeHtml(existing && existing.thumbnailUrl ? existing.thumbnailUrl : '') + '"><input type="file" name="thumbnailFile" accept="image/jpeg,image/png,image/webp,image/avif" data-upload-field="thumbnailUrl" style="margin-top:8px"></label>' +
              '<label class="rr-field" data-editor-type="video"><span>Video thumbnail Alt text <small>(describe the poster image)</small></span><input type="text" name="thumbnailAlt" maxlength="180" value="' + escapeHtml(existing && existing.thumbnailAlt ? existing.thumbnailAlt : '') + '" placeholder="Example: Video poster showing the lead actors"></label>' +
              '<label class="rr-field" data-editor-type="story video premium"><span>Audio URL (optional)</span><input type="text" name="audioUrl" value="' + escapeHtml(existing && existing.audioUrl ? existing.audioUrl : '') + '"></label>' +
              '<label class="rr-checkbox"><input type="checkbox" name="exclusive" ' + (existing && existing.exclusive ? 'checked' : '') + '> Members-only (logged-in + verified readers only)</label>' +
              '<label class="rr-field full"><span>Story text — plain paragraphs (blank line = new paragraph). # / ## for headings, ![alt](url) for images.</span>' +
                '<textarea name="content" id="storyContent" required>' + escapeHtml(existing ? existing.content : '') + '</textarea></label>' +
            '</div>' +
            '<div class="admin-actions">' +
              '<button type="submit" class="rr-submit admin-btn-secondary" data-action="draft">Save draft</button>' +
              '<button type="submit" class="rr-submit" data-action="publish">Save &amp; publish</button>' +
            '</div>' +
            '<div id="formStatus" style="margin-top:12px;"></div>' +
          '</form>' +
        '</div>';

      var form = document.getElementById('storyForm');
      if (isNew && (editorMode === 'video' || editorMode === 'image')) form.elements.contentType.value = editorMode;
      if (isNew && editorMode === 'premium') form.elements.exclusive.checked = true;
      function syncEditorType() { var kind = String(form.elements.contentType.value || 'text'); form.querySelectorAll('[data-editor-type]').forEach(function (field) { var types = String(field.getAttribute('data-editor-type') || '').split(/\s+/); field.hidden = types.indexOf(kind) === -1; }); var help = document.getElementById('contentTypeHelp'); if (help) help.textContent = kind === 'video' ? 'Video posts route to /video/. Upload a direct video file and add a thumbnail for the card.' : (kind === 'image' ? 'Image gallery posts route to /gellery/. Use the cover upload as the gallery image source.' : 'Story posts use the text editor and selected categories. Premium mode keeps the same type fields but unlocks content for verified members.'); }
      form.elements.contentType.addEventListener('change', syncEditorType);
      syncEditorType();
      if (qs('panel') === 'seo') window.setTimeout(function () { var seo = document.querySelector('.admin-seo-health'); if (seo) seo.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 300);
      form.querySelectorAll('[data-upload-field]').forEach(function (input) {
        input.addEventListener('change', function () {
          var file = input.files && input.files[0];
          if (!file) return;
          var target = form.elements[input.getAttribute('data-upload-field')];
          var status = document.getElementById('formStatus');
          var prefix = input.name === 'videoFile' ? 'videos' : 'images';
          var storyKey = form.elements.id.value || 'draft';
          var safeName = file.name.toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(-120) || 'upload';
          var key = prefix + '/' + storyKey + '/' + Date.now() + '-' + safeName;
          status.innerHTML = '<p class="rr-hint">Uploading ' + escapeHtml(file.name) + '…</p>';
          window.NightsAuth.adminUploadMedia(file, key).then(function (result) {
            target.value = result.url;
            status.innerHTML = '<p class="rr-hint rr-success">Upload complete. The media URL was added automatically.</p>';
          }).catch(function (err) {
            input.value = '';
            status.innerHTML = '<p class="rr-hint rr-error">Upload failed: ' + escapeHtml(err.message) + '</p>';
          });
        });
      });
      var submitAction = 'draft';
      form.querySelectorAll('[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () { submitAction = btn.getAttribute('data-action'); });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        form.elements.exclusive.checked = true;
        var status = document.getElementById('formStatus');
        var fd = new FormData(form);
        var id = String(fd.get('id') || '').trim();
        if (!/^[a-zA-Z0-9_-]{1,160}$/.test(id)) {
          status.innerHTML = '<p class="rr-hint rr-error">Story ID must be letters, numbers, - or _ only.</p>';
          return;
        }
        var contentTypeVal = String(fd.get('contentType') || 'text');
        if (contentTypeVal === 'video' && !String(fd.get('videoUrl') || '').trim()) {
          status.innerHTML = '<p class="rr-hint rr-error">Content type is "Video" but the Video URL field is empty — fill it in, or switch Content type back to "Story (text)".</p>';
          return;
        }
        if (contentTypeVal === 'image' && !String(fd.get('coverUrl') || '').trim()) {
          status.innerHTML = '<p class="rr-hint rr-error">Content type is "Image gallery" but the Cover image URL field is empty — fill it in, or switch Content type back to "Story (text)".</p>';
          return;
        }
        var selectedCategories = fd.getAll('categories').map(function (value) { return String(value || '').trim(); }).filter(Boolean);
        if (!selectedCategories.length) {
          status.innerHTML = '<p class="rr-hint rr-error">Tick at least one category before saving or publishing.</p>';
          return;
        }
        if (submitAction === 'publish' && form.dataset.seoReady !== 'true') {
          status.innerHTML = '<p class="rr-hint rr-error">Complete every SEO readiness item until the score reaches 100 before publishing. You can still save a draft.</p>';
          var health = document.querySelector('.admin-seo-health'); if (health) health.scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        }
        var payload = {
          id: id,
          title: String(fd.get('title') || '').trim(),
          excerpt: String(fd.get('excerpt') || '').trim(),
          content: String(fd.get('content') || ''),
          category: selectedCategories[0] || String(fd.get('category') || '').trim(),
          categories: selectedCategories,
          tags: String(fd.get('tags') || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean),
          series: String(fd.get('series') || '').trim() || null,
          episode: fd.get('episode') ? Number(fd.get('episode')) : null,
          contentType: String(fd.get('contentType') || 'text'),
          coverUrl: String(fd.get('coverUrl') || '').trim() || null,
          coverAlt: String(fd.get('coverAlt') || '').trim() || null,
          videoUrl: String(fd.get('videoUrl') || '').trim() || null,
          thumbnailUrl: String(fd.get('thumbnailUrl') || '').trim() || null,
          thumbnailAlt: String(fd.get('thumbnailAlt') || '').trim() || null,
          audioUrl: String(fd.get('audioUrl') || '').trim() || null,
          seoTitle: String(fd.get('seoTitle') || '').trim() || null,
          metaDescription: String(fd.get('metaDescription') || '').trim() || null,
          seoKeywords: String(fd.get('seoKeywords') || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean),
          exclusive: fd.get('exclusive') === 'on',
        };

        status.innerHTML = '<p class="rr-hint">Saving…</p>';
        var save = isNew
          ? window.NightsAuth.adminCreateStory(payload)
          : window.NightsAuth.adminUpdateStory(id, payload);

        save.then(function () {
          if (submitAction === 'publish') {
            return window.NightsAuth.adminPublishStory(id).then(function () {
              status.innerHTML = '<p class="rr-hint rr-success">Saved and published — it will appear on the live site automatically within about 20 minutes.</p>';
            });
          }
          status.innerHTML = '<p class="rr-hint rr-success">Draft saved.</p>';
        }).then(function () {
          setTimeout(function () { window.location.href = 'index.html'; }, 1400);
        }).catch(function (err) {
          status.innerHTML = '<p class="rr-hint rr-error">' + escapeHtml(err.message) + '</p>';
        });
      });
      if (window.MahmudaAdminPipeline) window.MahmudaAdminPipeline.enhanceEditor();
    }

    function init() {
      if (!window.NightsAuth) { renderGate('Something didn\'t load — try refreshing.', false); return; }
      window.NightsAuth.me().then(function (data) {
        if (!data.authenticated) { renderGate('Log in with an admin account to manage stories.', true); return; }
        if (!data.isAdmin) { renderGate('This account does not have content-manager access.', false); return; }

        var editId = qs('id');
        if (!editId) { renderForm(null); return; }

        window.NightsAuth.adminListStories().then(function (data) {
          var story = (data.stories || []).find(function (s) { return s.id === editId; });
          if (!story) { renderGate('Story "' + editId + '" not found.', false); return; }
          renderForm(story);
        }).catch(function (err) {
          renderGate('Could not load story: ' + err.message, false);
        });
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>
</body>
</html>
