  <main class="section" style="padding-top: 80px;">

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img class="logo-svg" src="../assets/logo.svg" alt="mahmuda.fun" loading="lazy" decoding="async" style="height: 30px; width: auto;" />
        </div>

        <p class="footer-copy">
          <a href="../index.html" style="color:var(--text-muted)">Home</a> ·
          <a href="../video/" style="color:var(--text-muted)">Video</a> ·
          <a href="../category/" style="color:var(--text-muted)">Category</a> ·

  <script>
  (function () {
    'use strict';
    var listEl = document.getElementById('seriesList');
    function esc(s) {
      return String(s || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"').replace(/'/g, '&#039;');
    }
    function render(stories) {
      var bySeries = {};
      stories.forEach(function (s) {
        if (!s.series) return;
        if (!bySeries[s.series]) bySeries[s.series] = [];
        bySeries[s.series].push(s);
      });
      var names = Object.keys(bySeries);
      if (!names.length) {
        listEl.innerHTML = '<div class="loading-state"><p>এখনো কোনো সিরিজ নেই।</p></div>';
        return;
      }
      listEl.innerHTML = names.map(function (name) {
        var eps = bySeries[name].sort(function (a, b) { return (a.episode || 0) - (b.episode || 0); });
        var first = eps[0];
        return '<section class="series-block" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:28px;">' +
          '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;">' +
            '<div class="feed-avatar" style="width:44px;height:44px;font-size:1.1rem;">▣</div>' +
            '<div><h2 style="font-family:var(--font-display);font-size:1.5rem;color:var(--text-primary);margin:0;">' + esc(name) + '</h2>' +
            '<p style="color:var(--text-muted);font-size:0.85rem;margin:4px 0 0;">' + eps.length + ' episode' + (eps.length > 1 ? 's' : '') + ' · ' + esc(first.category || '') + '</p></div>' +
          '</div>' +
          '<div class="episode-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;">' +
          eps.map(function (ep) {
            return '<a href="../index.html?story=' + encodeURIComponent(ep.id) + '" style="display:block;padding:14px 16px;border-radius:10px;background:var(--bg-secondary);border:1px solid var(--border);text-decoration:none;">' +
              '<div style="font-size:0.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;">Episode ' + (ep.episode != null ? ep.episode : '—') + '</div>' +
              '<div style="font-family:var(--font-display);font-weight:600;color:var(--text-primary);margin-top:4px;line-height:1.35;">' + esc(ep.title) + '</div>' +
              '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">' + esc(ep.date || '') + ' · ' + esc(ep.readTime || '') + '</div>' +
            '</a>';
          }).join('') +
          '</div></section>';
      }).join('');
    }
    fetch('../stories/index.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var stories = Array.isArray(data) ? data : [];
        stories.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
        render(stories);
      })
      .catch(function () {
        listEl.innerHTML = '<div class="loading-state"><p>লোড হচ্ছে না। <a href="../index.html" style="color:var(--accent)">Home</a></p></div>';
      });
  })();
  </script>
  <script src="../assets/js/navigation.js" defer></script>
  <script src="../assets/js/site-components.js" defer></script>
  <script src="../assets/js/ads.js" defer></script>
</body>
</html>
