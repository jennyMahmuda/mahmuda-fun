<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Content | mahmuda.fun</title>
  <meta name="description" content="Members-only premium stories, videos and image collections on mahmuda.fun." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://mahmuda.fun/premium.html" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/navigation.css" />
  <link rel="stylesheet" href="assets/css/blog.css" />
  <link rel="stylesheet" href="assets/css/admin-redesign.css" />
  <style>
    .premium-gate,.premium-wrap{max-width:1000px;margin:0 auto;padding:110px 18px 70px}.premium-gate{text-align:center}.premium-gate h1,.premium-wrap h1{font-family:var(--font-display);font-size:clamp(2rem,6vw,4rem);margin:0 0 10px}.premium-gate p,.premium-wrap .lead{color:var(--text-secondary);font-size:1.05rem;line-height:1.7}.premium-login{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:9px;background:#ef233c;color:#fff;text-decoration:none;font-weight:700}.premium-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:30px}.premium-card{overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--bg-card)}.premium-card img{display:block;width:100%;height:170px;object-fit:cover;background:#171923}.premium-card-body{padding:16px}.premium-card h2{font-size:1.15rem;margin:8px 0}.premium-badge{color:#f1c453;font-size:.72rem;font-weight:800;letter-spacing:.12em}.premium-card button{width:100%;margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elevated);color:var(--text-primary);cursor:pointer}.premium-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.82)}.premium-modal article{width:min(780px,100%);max-height:88vh;overflow:auto;padding:26px;border:1px solid var(--border);border-radius:14px;background:#111318}.premium-modal-close{float:right;background:transparent;border:0;color:#fff;font-size:1.8rem}.premium-body{white-space:pre-wrap;line-height:1.8;color:#e5e7eb}.premium-body video,.premium-body img{max-width:100%;border-radius:10px;margin:12px 0}@media(max-width:600px){.premium-gate,.premium-wrap{padding-top:90px}.premium-card img{height:145px}}
  </style>
</head>
<body>
  <header class="navbar"><div class="nav-container"><a href="index.html" class="logo" aria-label="mahmuda.fun home"><img class="logo-svg" src="assets/logo.svg" alt="mahmuda.fun logo" width="160" height="42" /></a><nav class="nav-links" id="navLinks"><a href="index.html" class="nav-item">Home</a><a href="premium.html" class="nav-item active">Premium</a><a href="account/" class="nav-item" id="navAccountLink"><span id="navAccountLabel">Log in</span></a></nav><div class="nav-actions"><button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☾</button><button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button></div></div></header>
  <main id="premiumMain"><div class="premium-gate"><p>Loading Premium…</p></div></main>
  <script src="assets/js/auth.js" defer></script><script src="assets/js/navigation.js" defer></script><script src="assets/js/site-components.js" defer></script><script src="assets/js/newsletter-footer.js" defer></script>
  <script>
  (function(){'use strict';
    var main=document.getElementById('premiumMain');
    function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
    function img(s){return esc(s.cover||s.thumbnailUrl||'assets/images/default-cover.svg');}
    function gate(message){main.innerHTML='<div class="premium-gate"><p class="hero-eyebrow">MEMBERS ONLY · 18+</p><h1>Premium content</h1><p>'+esc(message)+'</p><a class="premium-login" href="account/?next=../premium.html">Log in or verify your account</a></div>';}
    function openItem(s){window.NightsAuth.me().then(function(me){if(!me.authenticated){gate('Please log in to continue.');return;}if(!me.emailVerified){gate('Please verify your email before opening Premium content.');return;}return window.NightsAuth.fetchExclusiveContent(s.id).then(function(data){var modal=document.createElement('div');modal.className='premium-modal';var body=String(data.content||'').replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}).replace(/\n\s*\n/g,'</p><p>').replace(/\n/g,'<br>');modal.innerHTML='<article><button class="premium-modal-close" aria-label="Close">×</button><span class="premium-badge">PREMIUM · '+esc((s.type||'story').toUpperCase())+'</span><h2>'+esc(s.title)+'</h2><div class="premium-body"><p>'+body+'</p></div></article>';modal.addEventListener('click',function(e){if(e.target===modal||e.target.classList.contains('premium-modal-close'))modal.remove();});document.body.appendChild(modal);}).catch(function(err){gate(err.message||'Premium access could not be verified.');});});}
    function render(stories){var premium=(stories||[]).filter(function(s){return s.exclusive===true;});if(!premium.length){gate('Premium content is being prepared. Please check back soon.');return;}main.innerHTML='<div class="premium-wrap"><p class="hero-eyebrow">MEMBERS ONLY · 18+</p><h1>Premium content</h1><p class="lead">Verified members can access premium Story, Video and Image releases. Sign in to unlock the collection.</p><div class="premium-grid">'+premium.map(function(s){return '<article class="premium-card"><img src="'+img(s)+'" alt="" loading="lazy"><div class="premium-card-body"><span class="premium-badge">'+esc((s.type||'story').toUpperCase())+'</span><h2>'+esc(s.title||'Untitled')+'</h2><p>'+esc(s.excerpt||'Members-only release')+'</p><button type="button" data-premium-id="'+esc(s.id)+'">Unlock content</button></div></article>';}).join('')+'</div><section class="premium-card" style="margin-top:24px;padding:22px"><h2>Join Premium updates</h2><p>Get notified about new members-only releases. Your email is used only for Premium communication.</p><label><input id="premiumLeadConsent" type="checkbox"> I agree to receive Premium updates.</label><br><button type="button" id="premiumLeadBtn">Join Premium</button><p id="premiumLeadStatus" class="rr-hint"></p></section></div>';main.querySelectorAll('[data-premium-id]').forEach(function(b){b.addEventListener('click',function(){openItem(premium.find(function(s){return s.id===b.dataset.premiumId;}));});});var leadBtn=document.getElementById('premiumLeadBtn');if(leadBtn)leadBtn.addEventListener('click',function(){var consent=document.getElementById('premiumLeadConsent').checked,status=document.getElementById('premiumLeadStatus');if(!consent){status.textContent='Please give consent to join Premium updates.';return;}status.textContent='Saving…';window.NightsAuth.joinPremium('premium_page').then(function(){status.textContent='You are on the Premium updates list.';}).catch(function(err){status.textContent=err.message||'Please log in and verify your email first.';});});}
    function boot(){fetch('stories/index.json',{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){gate('Premium content could not be loaded right now.');});}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  })();
  </script>
</body>
</html>
