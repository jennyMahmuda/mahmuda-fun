  <script>
  (function () {
    'use strict';
    var grid = document.getElementById('catGrid');
    var sub = document.getElementById('catSub');
    var pills = document.getElementById('catPills');
    var currentCat = 'all';
    var m = (window.location.search || '').match(/[?&]cat=([^&]+)/);
    if (m) currentCat = decodeURIComponent(m[1]);
    function esc(s) {
      return String(s || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"').replace(/'/g, '&#039;');
    }
    function norm(s) { return String(s || '').toLowerCase().trim(); }
    function storyMatches(s, cat) {
      if (cat === 'all') return true;
      var c = norm(cat);
      var haystack = [s.type || 'text', s.category || '']
        .concat(s.tags || [], s.categories || [])
        .concat(s.series ? [s.series] : [])
        .map(norm);
      return haystack.indexOf(c) !== -1 || haystack.join(' ').indexOf(c) !== -1;
    }
    function coverUrl(s) {
      var p = s.cover || (s.images && s.images.length ? s.images[0] : '');
      if (!p) return '';
      if (/^https?:\/\//i.test(p)) return p;
      if (p.charAt(0) === '/') return p.substring(1);
      return p;
    }
    function buildPills(stories) {
      var counts = {};
      stories.forEach(function (s) {
        var keys = [s.type || 'text', s.category || ''].concat(s.tags || [], s.categories || []);
        keys.forEach(function (k) {
          var k2 = norm(k);
          if (k2 && k2 !== 'text' && k2 !== 'story') {
            counts[k2] = (counts[k2] || 0) + 1;
          }
        });
      });
      var order = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 12);
      var html = '<button class="filter-btn' + (currentCat === 'all' ? ' active' : '') + '" data-cat="all">All (' + stories.length + ')</button>';
      order.forEach(function (c) {
        var label = c.charAt(0).toUpperCase() + c.slice(1);
        var active = norm(currentCat) === c ? ' active' : '';
        html += '<button class="filter-btn' + active + '" data-cat="' + esc(c) + '">' + esc(label) + ' (' + counts[c] + ')</button>';
      });
      pills.innerHTML = html;
    }
    function render(stories, cat) {
      var list = stories.filter(function (s) { return storyMatches(s, cat); });
      if (sub) sub.textContent = cat === 'all' ? 'All stories by category' : cat + ' stories';
      if (!list.length) {
        grid.innerHTML = '<div class="loading-state"><p>এই ক্যাটাগরিতে এখনো স্টোরি নেই।</p></div>';
        return;
      }
      grid.innerHTML = list.map(function (s) {
        var img = coverUrl(s);
        var badge = s.series ? esc(s.series) : esc(s.category || s.type || 'Story');
        return '<a class="feed-card" href="index.html?story=' + encodeURIComponent(s.id) + '" style="text-decoration:none">' +
          (img ? '<div class="feed-card-media"><img src="' + esc(img) + '" alt="' + esc(s.title) + '" loading="lazy" decoding="async" onerror="this.style.display=\'none\'"></div>' : '') +
          '<div class="feed-card-header"><div class="feed-avatar">N</div><div class="feed-meta"><div class="feed-author">Nights</div><div class="feed-time">' + esc(s.date || '') + ' · ' + esc(s.readTime || '') + '</div></div>' +
          '<span class="feed-type-badge">' + badge + '</span></div>' +
          '<h2 class="feed-title">' + esc(s.title) + '</h2>' +
          '<p class="feed-excerpt">' + esc(s.excerpt || '') + '</p>' +
          '</a>';
      }).join('');
      document.querySelectorAll('#catPills .filter-btn').forEach(function (b) {
        b.classList.toggle('active', norm(b.getAttribute('data-cat')) === norm(cat));
      });
    }
    var cachedStories = [];
    function init() {
      fetch('stories/index.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          cachedStories = Array.isArray(data) ? data : [];
          cachedStories.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
          buildPills(cachedStories);
          render(cachedStories, currentCat);
        })
        .catch(function () {
          grid.innerHTML = '<div class="loading-state"><p>লোড হচ্ছে না। <a href="index.html" style="color:var(--accent)">Home</a></p></div>';
        });
    }
    pills.addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      currentCat = btn.getAttribute('data-cat');
      buildPills(cachedStories);
      render(cachedStories, currentCat);
    });
    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
