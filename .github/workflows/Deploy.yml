name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.x'

jobs:
  build:
    name: Build and validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install image-report dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow

      - name: Install Node dependencies
        run: npm ci

      - name: Build stories, metadata and sitemap
        run: npm run build

      - name: Run image report
        run: npm run images:report

      - name: Syntax checks
        run: |
          node --check assets/js/blog.js
          node --check assets/js/ads.js
          node --check assets/js/navigation.js
          node --check assets/js/site-components.js
          node --check assets/js/rating-review.js
          node --check cloudflare/worker/src/index.js

      - name: Validate all pages and required assets
        run: npm run validate

      - name: Assemble complete Pages artifact
        run: |
          # Stage into a directory OUTSIDE the repo checkout so the staging
          # dir never ends up nested inside the thing being copied
          # (that self-nesting is what caused "cp: cannot copy a directory,
          # '.', into itself, '_site/.'" in earlier runs).
          SITE_DIR="${{ runner.temp }}/_site"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          cp -R . "$SITE_DIR"
          rm -rf "$SITE_DIR/.git" "$SITE_DIR/.github" "$SITE_DIR/node_modules"
          find "$SITE_DIR" -name '__pycache__' -type d -prune -exec rm -rf {} +
          find "$SITE_DIR" -name '*.pyc' -delete
          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/sitemap.xml"
          test -f "$SITE_DIR/robots.txt"
          echo "Published files: $(find "$SITE_DIR" -type f | wc -l)"
          # Package the site into a tarball exactly as GitHub Pages expects
          tar --dereference --hard-dereference --directory "$SITE_DIR" -cvf ${{ runner.temp }}/artifact.tar .

      - name: Upload Pages artifact
        # Replaced composite action with direct, securely pinned upload-artifact (v4.3.6)
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4