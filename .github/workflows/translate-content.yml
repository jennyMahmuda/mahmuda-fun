name: Translate story content

# Keeps stories/i18n/** (and stories/i18n-index.json) up to date so the
# reader-facing language switcher (assets/js/i18n.js) has real translated
# text to serve. Runs independently of the Pages/Worker deploys — it only
# ever touches stories/i18n/** and commits straight to main, which then
# triggers the normal "Build and Deploy Pages" workflow to ship the fresh
# translations. See script/translate-content.js and cloudflare/README.md
# for the full design (budget cap, caching, the manual:true hand-tune
# hook).
#
# Safe to run with no Google credentials configured yet, or with nothing
# new to translate — script/translate-content.js no-ops cleanly either
# way and this workflow just ends without committing anything.

on:
  push:
    branches: [main]
    paths:
      - 'story-post/**'
  schedule:
    # Once a day is enough to keep chipping away at a budget-deferred
    # backlog (see MONTHLY_FREE_BUDGET in script/translate-content.js)
    # without needing anyone to push a new story just to make progress.
    # Arbitrary off-the-hour time to avoid the GitHub Actions top-of-hour
    # scheduling crunch.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-content
  # Unlike this repo's other workflows, don't cancel a run already in
  # progress — it may have already spent part of this month's translation
  # budget and be partway through writing files; letting it finish and
  # commit is cheaper than losing that work and starting over next time.
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  translate:
    name: Translate new/changed stories and commit the result
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate script source
        run: node --check script/translate-content.js

      - name: Build stories (fresh input for the translator)
        run: npm run build

      - name: Translate new/changed stories
        run: node script/translate-content.js
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}

      - name: Commit and push translations, if anything changed
        run: |
          if git status --porcelain -- stories/i18n stories/i18n-index.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stories/i18n stories/i18n-index.json
            git commit -m "chore: update translated story content"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Pushed updated translations — the Pages deploy workflow will pick them up."
          else
            echo "Nothing to commit — no new or changed translations this run."
          fi
