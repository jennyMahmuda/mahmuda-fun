name: Deploy Nights

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Build stories + sitemap
        run: |
          node script/blog-builder.js || true
          ls -la stories/ sitemap.xml robots.txt || true

      - name: Performance audit (Lighthouse guardian)
        run: |
          python3 script/Lighthouse.py --fix || true
          python3 script/Lighthouse.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp privacy-policy.html gallery.html video.html categories.html series.html _site/ 2>/dev/null || true
          cp sitemap.xml robots.txt llms.txt _site/ 2>/dev/null || true
          cp CNAME _site/ 2>/dev/null || echo "mahmuda.fun" > _site/CNAME
          cp -r assets stories _site/
          # Story covers and inline media live in story-post/image/ and story-post/video/ —
          # they must be served too (blog.js resolves `story-post/image/...` URLs)
          cp -r story-post _site/ 2>/dev/null || true
          echo "--- _site ---" && find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
