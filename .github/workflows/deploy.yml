# ============================================================
#  Nights (mahmuda.fun) – Auto Build & Deploy Workflow
# ============================================================
name: 🌙 Deploy Nights

on:
  push:
    branches: [main] # main ব্রাঞ্চে পুশ করলেই এটি রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Stories & Site
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🏗️ Build Stories (MD to JSON) & Sitemap
        # এই কমান্ডটি আপনার মার্কডাউন ফাইলগুলোকে প্রসেস করে JSON বানাবে
        run: |
          node script/blog-builder.js
          echo "Build completed. Verifying generated files..."
          ls -la stories/ || echo "No stories folder generated!"

      - name: 📂 Assemble Static Site
        # সাইটের সব প্রয়োজনীয় ফাইল _site ফোল্ডারে গুছিয়ে রাখা হচ্ছে
        run: |
          mkdir -p _site
          
          # Core HTML files
          cp index.html _site/
          [ -f video.html ] && cp video.html _site/ || true
          [ -f gallery.html ] && cp gallery.html _site/ || true
          [ -f privacy-policy.html ] && cp privacy-policy.html _site/ || true
          
          # SEO & Config
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          [ -f robots.txt ] && cp robots.txt _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || echo "mahmuda.fun" > _site/CNAME
          
          # Directories (CSS, JS, Images, Generated JSON Stories)
          [ -d assets ] && cp -r assets _site/ || true
          [ -d stories ] && cp -r stories _site/ || true
          [ -d video-slides ] && cp -r video-slides _site/ || true
          
          # Standalone media if any
          [ -f university-madam-teaser.mp4 ] && cp university-madam-teaser.mp4 _site/ || true
          
          echo "--- Content of _site directory ---"
          ls -la _site/

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy Site
        id: deployment
        uses: actions/deploy-pages@v4