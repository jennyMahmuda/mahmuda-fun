# ============================================================
#  Nights – Fully Dynamic Build & Deploy
# ============================================================
name: 🌙 Deploy Nights

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Assemble
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🏗️ Convert All Markdown to Stories
        run: |
          node script/blog-builder.js
          echo "Markdown converted dynamically!"

      - name: 📂 Assemble Dynamic Site
        run: |
          mkdir -p _site
          
          # ১. যেকোনো HTML ফাইল অটোমেটিক কপি করবে (index, video, gallery বা নতুন যেকোনো পেজ)
          cp *.html _site/ 2>/dev/null || true
          
          # ২. কনফিগারেশন ফাইল
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          [ -f robots.txt ] && cp robots.txt _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || echo "mahmuda.fun" > _site/CNAME
          
          # ৩. ফোল্ডারগুলো কপি করবে
          [ -d assets ] && cp -r assets _site/ || true
          [ -d stories ] && cp -r stories _site/ || true
          
          # ৪. story-post ফোল্ডারটিও কপি করবে, যাতে এর ভেতরের ছবি/ভিডিওগুলো লাইভ সাইটে কাজ করে
          [ -d story-post ] && cp -r story-post _site/ || true

      - name: 📤 Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy Site
        id: deployment
        uses: actions/deploy-pages@v4