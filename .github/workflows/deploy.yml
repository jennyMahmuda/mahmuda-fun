name: Deploy night story

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Markdown files convert korar environment setup
      - name: Convert Markdown to HTML
        run: |
          npm install -g marked
          # Automatic find all .md files and generate html format 
          for file in stories/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .md)
              marked -i "$file" -o "stories/${filename}.html"
              echo "Converted $file to stories/${filename}.html"
            fi
          done
          
      - name: Create .nojekyll bypass
        run: touch .nojekyll
        
      - name: Install NPM Dependencies
        run: npm ci
        
      - name: Build story HTML & JSON
        run: npm run build
        
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
