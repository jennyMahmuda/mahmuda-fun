# ============================================================
#  Nights (mahmuda.fun) – Deploy Workflow
# ============================================================
name: 🌙 Deploy Nights

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Using official stable tags to prevent "Action Not Found" crashes.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build stories + sitemap
        # Removed '|| true' on the node script. 
        # If the build fails, the action MUST fail so you don't deploy a broken site.
        run: |
          node script/blog-builder.js
          ls -la stories/ sitemap.xml robots.txt || true

      - name: Assemble site
        # Added conditional checks ([ -f ... ] and [ -d ... ]) to prevent workflow crashes 
        # if a file or directory is temporarily missing from the repository.
        run: |
          mkdir -p _site
          
          # Core Files
          cp index.html _site/
          [ -f privacy-policy.html ] && cp privacy-policy.html _site/ || true
          [ -f video.html ] && cp video.html _site/ || true
          [ -f gallery.html ] && cp gallery.html _site/ || true
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          [ -f robots.txt ] && cp robots.txt _site/ || true
          
          # CNAME Generation
          [ -f CNAME ] && cp CNAME _site/ || echo "mahmuda.fun" > _site/CNAME
          
          # Directories
          [ -d assets ] && cp -r assets _site/ || true
          [ -d stories ] && cp -r stories _site/ || true
          [ -d video-slides ] && cp -r video-slides _site/ || true
          
          # Media / Misc
          [ -f README.md ] && cp README.md _site/ || true
          [ -f university-madam-teaser.mp4 ] && cp university-madam-teaser.mp4 _site/ || true
          
          echo "--- _site contents ---"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4