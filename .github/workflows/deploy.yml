# ---------------------------------------------------------------
# mahmuda.fun — Build & Deploy (GitHub Pages)
# ---------------------------------------------------------------
# Why this workflow:
#  1. The repository is configured to REJECT any action that is
#     not pinned to a full 40-character commit SHA.
#     Old tags like `actions/checkout@v4` are blocked, which is
#     exactly what broke the previous pipeline.
#  2. All actions below are pinned to the exact commit SHA of
#     the same major version (verified via the actions repos).
#  3. The builder has ZERO runtime dependencies (plain Node.js,
#     fs/path only), so `npm ci` is replaced by `npm install --no-fund --no-audit`
#     as a no-op-safe step — it creates package-lock only when missing.
# ---------------------------------------------------------------

name: Deploy night story

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4  ->  sha:11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # actions/setup-node@v4 -> sha:49933ea5288caeca8642d1e84afbd3f7d6820020
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # -----------------------------------------------------------
      # Build: stories/*.json + stories/index.json + sitemap.xml + robots.txt
      # Builder needs no third-party packages (pure Node.js core).
      # npm install here is only a safety-net if a lockfile ever exists.
      # -----------------------------------------------------------
      - name: Prepare dependencies (no-ops if none required)
        run: npm install --no-fund --no-audit --ignore-scripts 2>/dev/null || true

      - name: Build story JSON + sitemap + robots
        run: npm run build

      # GitHub Pages needs .nojekyll so paths like assets/css/blog.css
      # and story-post/image/ are served untouched.
      # Explicitly pin the upload-artifact dependency that
      # actions/upload-pages-artifact@v3 uses internally —
      # otherwise the runner rejects the nested `actions/upload-artifact@v4`.
      - name: Pin upload-artifact@v4 (required by upload-pages-artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-artifact
          path: .nojekyll
          retention-days: 0

      - name: Create .nojekyll bypass
        run: touch .nojekyll

      # actions/configure-pages@v5 -> sha:983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Setup GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # actions/upload-pages-artifact@v3 -> sha:56afc609e74202658d3ffba0e8f6dda462b719fa
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # actions/deploy-pages@v4 -> sha:d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
