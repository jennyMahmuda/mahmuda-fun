# ============================================================
#  Nights (mahmuda.fun) – Deploy Workflow
#  Actions pinned to full SHA (required by repo policy)
# ============================================================
name: 🌙 Deploy Nights

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: Build stories + sitemap
        run: |
          node script/blog-builder.js || true
          ls -la stories/ sitemap.xml robots.txt || true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp privacy-policy.html _site/ 2>/dev/null || true
          cp video.html _site/ 2>/dev/null || true
          cp gallery.html _site/ 2>/dev/null || true
          cp sitemap.xml _site/ 2>/dev/null || true
          cp robots.txt _site/ 2>/dev/null || true
          cp CNAME _site/ 2>/dev/null || echo "mahmuda.fun" > _site/CNAME
          cp -r assets _site/
          cp -r stories _site/
          [ -f README.md ] && cp README.md _site/ || true
          # also copy any media if present
          [ -d video-slides ] && cp -r video-slides _site/ || true
          [ -f university-madam-teaser.mp4 ] && cp university-madam-teaser.mp4 _site/ || true
          echo "--- _site contents ---"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
