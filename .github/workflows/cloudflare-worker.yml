name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  deploy-worker:
    name: Apply D1 migrations and deploy Worker
    if: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker source
        run: node --check cloudflare/worker/src/index.js

      - name: Build stories (regenerates the exclusive-content D1 seed)
        run: npm run build

      - name: Apply D1 migrations
        run: npm run cf:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync exclusive story content to D1
        run: npx wrangler d1 execute mahmuda_fun_reviews --remote --file=cloudflare/generated/exclusive-content.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Provision configured admin account
        if: ${{ env.ADMIN_USERNAME != '' && env.ADMIN_PASSWORD != '' }}
        run: node script/bootstrap-admin.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure admin login secrets
        if: ${{ env.ADMIN_USERNAME != '' && env.ADMIN_PASSWORD != '' }}
        run: |
          set -e
          printf '%s' "$ADMIN_USERNAME" | npx wrangler secret put ADMIN_USERNAME
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          echo "Admin login secrets configured without printing secret values"

      - name: Deploy Worker
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure optional secrets (skips any that aren't set yet)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Account signup/login works without any of these being set, but
          # verification/reset emails silently won't send, IP-hash rate
          # limiting falls back to an unpepper-ed hash, server-side
          # sign_up/login analytics events won't send, and the "Trending"
          # GA4 top-content section stays empty, until they're added as
          # repo secrets. See cloudflare/README.md. Each block below fails
          # the job (not just logs a warning) if the value WAS provided
          # but `wrangler secret put` itself failed.
          set -e
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY not set — skipping (signup/verification emails won't send until it is)"
          fi
          if [ -n "$RESEND_FROM_EMAIL" ]; then
            printf '%s' "$RESEND_FROM_EMAIL" | npx wrangler secret put RESEND_FROM_EMAIL
          else
            echo "RESEND_FROM_EMAIL not set — skipping"
          fi
          if [ -n "$AUTH_SECRET" ]; then
            printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET
          else
            echo "AUTH_SECRET not set — skipping (login rate-limit IP hashing runs unpeppered until it is)"
          fi
          if [ -n "$GA_API_SECRET" ]; then
            printf '%s' "$GA_API_SECRET" | npx wrangler secret put GA_API_SECRET
          else
            echo "GA_API_SECRET not set — skipping (server-side sign_up/login GA4 events won't send until it is)"
          fi
          if [ -n "$GOOGLE_PROJECT_ID" ]; then
            printf '%s' "$GOOGLE_PROJECT_ID" | npx wrangler secret put GOOGLE_PROJECT_ID
          else
            echo "GOOGLE_PROJECT_ID not set — skipping (not currently read by any Worker code, kept for future use)"
          fi
          if [ -n "$GOOGLE_CLIENT_EMAIL" ]; then
            printf '%s' "$GOOGLE_CLIENT_EMAIL" | npx wrangler secret put GOOGLE_CLIENT_EMAIL
          else
            echo "GOOGLE_CLIENT_EMAIL not set — skipping (required for the GA4 'Trending' top-content section)"
          fi
          if [ -n "$GOOGLE_PRIVATE_KEY" ]; then
            printf '%s' "$GOOGLE_PRIVATE_KEY" | npx wrangler secret put GOOGLE_PRIVATE_KEY
          else
            echo "GOOGLE_PRIVATE_KEY not set — skipping (required for the GA4 'Trending' top-content section)"
          fi
          if [ -n "$GA_PROPERTY_ID" ]; then
            printf '%s' "$GA_PROPERTY_ID" | npx wrangler secret put GA_PROPERTY_ID
          else
            echo "GA_PROPERTY_ID not set — skipping (required for the GA4 'Trending' top-content section; find it in GA4 Admin -> Property Settings -> Property ID, a plain number)"
          fi
          if [ -n "$ADMIN_USERNAME" ] && [ -n "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_USERNAME / ADMIN_PASSWORD already configured in the pre-deploy step"
          else
            echo "ADMIN_USERNAME / ADMIN_PASSWORD not set — admin secret login remains disabled"
          fi
