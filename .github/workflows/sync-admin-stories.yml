name: Sync admin-submitted stories

# Turns stories published through the /admin/ content manager into real
# story-post/<id>.md files and commits them — which then triggers the
# normal "Build and Deploy Pages" workflow, exactly like a hand-authored
# story would. See script/sync-admin-stories.js for the full design.
#
# Safe to run on a schedule even when nothing was published — it just
# finds zero rows and exits without committing anything.

on:
  schedule:
    # Every 20 minutes — close enough to "goes live shortly after you
    # click Publish" without needing the Worker to have GitHub write
    # access just to trigger this on demand.
    - cron: '*/22 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-admin-stories
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  sync:
    name: Write newly published admin stories and commit them
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate script source
        run: node --check script/sync-admin-stories.js

      - name: Sync newly published admin stories
        run: node script/sync-admin-stories.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit and push new story files, if any
        id: sync
        run: |
          if git status --porcelain -- story-post | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add story-post
            git commit -m "chore: sync admin-published stories"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Pushed new story-post files."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to sync this run."
          fi

      - name: Trigger the Pages deploy workflow
        # A commit pushed with the default GITHUB_TOKEN does NOT fire other
        # workflows' `on: push` triggers — this is a deliberate GitHub
        # loop-prevention rule, not a bug in this repo, but it means the
        # push above never actually kicked off "Build and Deploy Pages" on
        # its own (it just sat there until the next scheduled Pages build,
        # if any). Firing Deploy.yml's workflow_dispatch explicitly via
        # the API — allowed by this job's own `actions: write` permission,
        # no extra secret needed — closes that gap so a published story
        # goes live right after this run, not "eventually, maybe".
        if: steps.sync.outputs.pushed == 'true'
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/Deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Triggered the Pages deploy workflow."
